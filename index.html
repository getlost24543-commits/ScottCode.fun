<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><meta name="description" content="ScottCode — technology, creativity, projects and browser games."><title>ScottCode</title><style>
:root{--bg:#071426;--panel:rgba(12,32,53,.84);--line:#29445e;--text:#edf7ff;--muted:#9db5d0;--blue:#7dc7ff;--cyan:#7ce9f4}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 10% 0%,#103966,transparent 42%),radial-gradient(ellipse at 90% 35%,#073c4b,transparent 40%),var(--bg);color:var(--text)}body{min-height:100vh}.app-header{position:sticky;top:0;z-index:100;padding:12px clamp(10px,3vw,28px);background:#071426e8;border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}.bar{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border:1px solid #ffffff15;background:#10243bce;border-radius:17px}.brand{font-weight:900;font-size:1.15rem;color:var(--text);text-decoration:none;white-space:nowrap}.brand b{color:var(--blue)}nav{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.nav-link{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:11px;padding:10px 12px;font-weight:750;cursor:pointer;font:inherit;font-size:.9rem}.nav-link:hover,.nav-link.active{background:#173b59;color:#fff;border-color:#2d5c7d}.menu-toggle{display:none;border:1px solid var(--line);background:#173653;color:white;border-radius:11px;padding:9px 12px;font-size:1.2rem}.stage{max-width:1240px;margin:0 auto;padding:14px clamp(8px,2vw,22px) 30px}#viewFrame{display:block;width:100%;height:70vh;border:0;border-radius:18px;background:transparent;overflow:hidden}footer{max-width:1200px;margin:0 auto;padding:15px 20px 25px;border-top:1px solid #ffffff14;text-align:center;color:#7893b2;font-size:.8rem}.noscript{padding:20px;color:#fff}@media(max-width:680px){.bar{flex-wrap:wrap}.menu-toggle{display:block}nav{display:none;position:absolute;left:10px;right:10px;top:76px;padding:10px;background:#0b1e32;border:1px solid var(--line);border-radius:15px;box-shadow:0 20px 45px #0005;flex-direction:column;align-items:stretch}nav.open{display:flex}.nav-link{text-align:left;width:100%;padding:13px}.stage{padding:8px 6px 20px}#viewFrame{border-radius:12px}}
</style></head><body>
<header class="app-header"><div class="bar"><a class="brand" href="#" data-view="home" aria-label="ScottCode home">&lt;/&gt; ScottCode<b>.</b></a><button class="menu-toggle" id="menuToggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="navLinks">☰</button><nav id="navLinks" aria-label="Main navigation"><button class="nav-link active" data-view="home">Home</button><button class="nav-link" data-view="about">About</button><button class="nav-link" data-view="projects">Projects</button><button class="nav-link" data-view="arcade">Arcade</button><button class="nav-link" data-view="account">Account</button><button class="nav-link" data-view="contact">Contact</button></nav></div></header>
<main class="stage"><iframe id="viewFrame" title="ScottCode page" src="home.html" loading="eager"></iframe><noscript><div class="noscript">Please enable JavaScript to use ScottCode navigation.</div></noscript></main><footer>© <span id="year"></span> ScottCode · Built with curiosity.</footer>
<script>
(()=>{'use strict';const frame=document.getElementById('viewFrame'),nav=document.getElementById('navLinks'),toggle=document.getElementById('menuToggle');let current='home';const pages={home:'home.html',about:'about/',projects:'projects/',arcade:'games/',account:'games/',contact:'contact/',thanks:'thanks/'};const labels=[...document.querySelectorAll('[data-view]')];let resizeTimer;
function closeMenu(){nav.classList.remove('open');toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','Open navigation');toggle.textContent='☰'}
function tuneFrame(){try{const d=frame.contentDocument;if(!d)return;const style=d.createElement('style');style.id='scottcode-shell-style';style.textContent='html{scroll-behavior:auto!important}body{margin-top:0!important}header,.top,.nav-wrap,body>header,body>footer{display:none!important}';const old=d.getElementById('scottcode-shell-style');if(old)old.remove();d.head.appendChild(style);const update=()=>{const h=Math.max(d.body?.scrollHeight||0,d.documentElement?.scrollHeight||0,450);frame.style.height=Math.min(h,20000)+'px'};update();if(window.ResizeObserver){if(frame._ro)frame._ro.disconnect();frame._ro=new ResizeObserver(update);frame._ro.observe(d.documentElement);if(d.body)frame._ro.observe(d.body)}setTimeout(update,250);setTimeout(update,900);if(current==='account'){const auth=d.querySelector('#auth')||d.querySelector('#form');if(auth)setTimeout(()=>auth.scrollIntoView({block:'start',behavior:'auto'}),100)}}catch(e){frame.style.height='75vh'}}
function showView(name,push=true){if(!pages[name])name='home';current=name;labels.forEach(el=>{const active=el.dataset.view===name;el.classList.toggle('active',active);if(active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});closeMenu();const target=pages[name];if(frame.getAttribute('src')!==target){frame.setAttribute('src',target)}else tuneFrame();if(push)history.pushState({scottCodeView:name},'',location.href);window.scrollTo(0,0);}
frame.addEventListener('load',tuneFrame);toggle.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const open=nav.classList.toggle('open');toggle.setAttribute('aria-expanded',String(open));toggle.setAttribute('aria-label',open?'Close navigation':'Open navigation');toggle.textContent=open?'✕':'☰'});document.addEventListener('click',e=>{const item=e.target.closest('[data-view]');if(item){e.preventDefault();showView(item.dataset.view);return}if(!nav.contains(e.target)&&!toggle.contains(e.target))closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});window.addEventListener('popstate',e=>showView(e.state?.scottCodeView||'home',false));document.getElementById('year').textContent=new Date().getFullYear();history.replaceState({...(history.state||{}),scottCodeView:'home'},'',location.href);window.scottCodeShowView=showView;
// Keep internal navigation inside the embedded page. The browser address bar remains at the root.
frame.addEventListener('load',()=>{try{const d=frame.contentDocument;if(!d)return;d.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;const url=new URL(a.href,location.href);if(url.origin!==location.origin)return;const path=url.pathname.replace(/\/+$/,'')||'/';const map={'/':'home','/home.html':'home','/about':'about','/projects':'projects','/games':'arcade','/contact':'contact','/thanks':'thanks'};if(map[path]){e.preventDefault();showView(map[path]);}} ,true)}catch(e){}});
})();
</script></body></html>
