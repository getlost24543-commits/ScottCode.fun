<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080a09">
  <meta name="description" content="May Panche — an interactive garden behind frosted glass.">
  <title>MAY PANCHE — a little garden</title>
  <link rel="preload" href="assets/garden.svg" as="image" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="experience">
    <header class="brand" aria-label="May Panche">
      <a href="./" class="brand-name">MAY PANCHE</a>
      <span class="brand-note">A LITTLE GARDEN</span>
    </header>

    <section class="controls" aria-label="Garden controls">
      <div class="control frost-control">
        <div class="dial" id="frostDial" aria-hidden="true"><span id="frostNumber">75</span></div>
        <label for="frosting">FROSTING</label>
        <input id="frosting" type="range" min="0" max="100" value="75" aria-label="Frosting amount">
      </div>
      <button class="control icon-control" id="windButton" type="button" aria-pressed="false">
        <span class="symbol wind-symbol" aria-hidden="true">〰</span><span>WIND</span>
      </button>
      <button class="control icon-control" id="sunButton" type="button" aria-pressed="false">
        <span class="symbol sun-symbol" aria-hidden="true">☼</span><span>SUN</span>
      </button>
      <button class="control icon-control active" id="gardenButton" type="button" aria-pressed="true">
        <span class="symbol garden-symbol" aria-hidden="true">✿</span><span>GARDEN</span>
      </button>
    </section>

    <section class="glass-stage" aria-label="Interactive frosted glass. Drag or swipe to clear it.">
      <div class="garden-scene" id="gardenScene" aria-hidden="true">
        <img src="assets/garden.svg" alt="">
        <div class="sun-glow"></div>
        <div class="wind-layer"></div>
      </div>
      <div class="glass-shape">
        <canvas id="frostCanvas" aria-label="Drag your finger or mouse across the glass to clear the frost"></canvas>
        <div class="glass-shine" aria-hidden="true"></div>
        <div class="glass-edge" aria-hidden="true"></div>
        <div class="touch-ring" id="touchRing" aria-hidden="true"></div>
      </div>
      <p class="hint" id="hint">TOUCH THE GLASS TO REVEAL THE GARDEN</p>
    </section>

    <footer class="footer">
      <button id="soundButton" class="sound-button" type="button" aria-pressed="false">SOUND OFF</button>
      <button id="resetButton" class="reset-button" type="button">↻ &nbsp; RESET GLASS</button>
      <span class="footer-mark">MAY PANCHE ©</span>
    </footer>
    <div class="sr-only" id="status" aria-live="polite"></div>
  </main>
</body>
</html>
