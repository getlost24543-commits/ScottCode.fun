<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#031326"><title>Message Received | ScottCode</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --background: #031326;
        --blue: #72baff;
        --light-blue: #b8e0ff;
        --text: #f0f7ff;
        --muted: #9cb8d3;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow: hidden;
        position: relative;
        background: var(--background);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
    }

    /* Animated background */

    .background {
        position: fixed;
        inset: 0;
        overflow: hidden;
        z-index: -1;
        pointer-events: none;
    }

    .orb {
        position: absolute;
        width: 350px;
        height: 350px;
        border-radius: 50%;
        background: rgba(42, 137, 255, 0.12);
        filter: blur(85px);
        animation: float 12s ease-in-out infinite alternate;
    }

    .orb.one {
        top: -100px;
        left: -100px;
    }

    .orb.two {
        bottom: -120px;
        right: -80px;
        background: rgba(0, 225, 255, 0.09);
        animation-delay: -5s;
    }

    .orb.three {
        top: 40%;
        left: 65%;
        width: 220px;
        height: 220px;
        background: rgba(68, 94, 255, 0.10);
        animation-delay: -8s;
    }

    @keyframes float {
        from {
            transform: translate(0, 0) scale(1);
        }

        to {
            transform: translate(55px, 35px) scale(1.2);
        }
    }

    /* Subtle grid */

    .grid {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background-image:
            linear-gradient(rgba(114, 186, 255, 0.035) 1px, transparent 1px),
            linear-gradient(90deg, rgba(114, 186, 255, 0.035) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    /* Main card */

    .container {
        width: 100%;
        max-width: 540px;
        animation: appear 0.8s ease-out both;
    }

    @keyframes appear {
        from {
            opacity: 0;
            transform: translateY(25px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .card {
        position: relative;
        padding: 48px 32px;
        text-align: center;
        background: rgba(9, 28, 49, 0.82);
        border: 1px solid rgba(114, 186, 255, 0.22);
        border-radius: 26px;
        box-shadow:
            0 25px 90px rgba(0, 0, 0, 0.30),
            0 0 45px rgba(51, 145, 255, 0.07);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
    }

    /* Success icon */

    .success-icon {
        width: 82px;
        height: 82px;
        margin: 0 auto 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        border: 1px solid rgba(114, 186, 255, 0.45);
        background: rgba(58, 151, 255, 0.12);
        box-shadow: 0 0 35px rgba(69, 163, 255, 0.13);
        animation: glow 3s ease-in-out infinite;
    }

    .success-icon svg {
        width: 39px;
        height: 39px;
        stroke: var(--blue);
        stroke-width: 2.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    @keyframes glow {
        0%, 100% {
            box-shadow: 0 0 25px rgba(69, 163, 255, 0.10);
        }

        50% {
            box-shadow: 0 0 45px rgba(69, 163, 255, 0.24);
        }
    }

    /* Text */

    .eyebrow {
        margin-bottom: 16px;
        color: var(--blue);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
    }

    h1 {
        margin-bottom: 18px;
        font-size: clamp(30px, 6vw, 43px);
        line-height: 1.15;
        letter-spacing: -1.4px;
    }

    h1 span {
        color: var(--blue);
    }

    .description {
        max-width: 390px;
        margin: 0 auto;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.8;
    }

    /* Home button */

    .actions {
        margin-top: 32px;
    }

    .home-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 11px;
        width: 100%;
        min-height: 54px;
        padding: 15px 22px;
        border: 1px solid transparent;
        border-radius: 13px;
        background: var(--blue);
        color: #031326;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        transition:
            transform 0.25s ease,
            box-shadow 0.25s ease,
            background 0.25s ease;
    }

    .home-button:hover {
        transform: translateY(-3px);
        background: var(--light-blue);
        box-shadow: 0 10px 30px rgba(82, 172, 255, 0.22);
    }

    .home-button:active {
        transform: translateY(0);
    }

    .home-button svg {
        width: 19px;
        height: 19px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: transform 0.25s ease;
    }

    .home-button:hover svg {
        transform: translateX(-4px);
    }

    /* Footer */

    .footer {
        margin-top: 28px;
        color: #64819d;
        font-size: 12px;
        letter-spacing: 0.5px;
    }

    .footer a {
        color: #8fbce7;
        text-decoration: none;
    }

    .footer a:hover {
        color: var(--light-blue);
    }

    /* Mobile */

    @media (max-width: 480px) {
        .card {
            padding: 38px 23px;
            border-radius: 21px;
        }

        .success-icon {
            width: 72px;
            height: 72px;
            margin-bottom: 25px;
        }

        .description {
            font-size: 14px;
        }
    }

    /* Respect reduced-motion preferences */

    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
            scroll-behavior: auto !important;
        }
    }
</style>

</head><body><div class="background" aria-hidden="true">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
</div>

<div class="grid" aria-hidden="true"></div>

<main class="container">
    <section class="card">

        <div class="success-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
                <path d="M5 12.5l4.5 4.5L19 7"></path>
            </svg>
        </div>

        <p class="eyebrow">ScottCode · Contact</p>

        <h1>
            Thanks for <span>reaching out.</span>
        </h1>

        <p class="description">
            Your message has been submitted successfully.
            Thanks for taking the time to contact ScottCode.
            I'll be glad to hear from you again.
        </p>

        <div class="actions">
            <a
                class="home-button"
                href="https://scottcode.fun/"
                aria-label="Return to the ScottCode main website"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M19 12H5"></path>
                    <path d="M12 19l-7-7 7-7"></path>
                </svg>

                Back to Main Website
            </a>
        </div>

        <footer class="footer">
            Built with care by
            <a href="https://scottcode.fun/">ScottCode</a>
        </footer>

    </section>
</main>

</script>
<script src="/index.js"></script></body>
  </html>
